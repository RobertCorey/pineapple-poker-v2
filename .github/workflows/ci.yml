name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build functions
        run: npm run build -w functions

      - name: Build dealer
        run: npm run build -w dealer

      - name: Build frontend
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

  preview:
    needs: check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Authenticate to Firebase
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/sa-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json" >> "$GITHUB_ENV"

      - name: Deploy to preview channel
        id: preview
        run: |
          CHANNEL="pr-${{ github.event.pull_request.number }}"
          OUTPUT=$(npx firebase-tools hosting:channel:deploy "$CHANNEL" \
            --project pineapple-poker-8f3 \
            --expires 7d \
            --no-authorized-domains \
            2>&1)
          echo "$OUTPUT"
          URL=$(echo "$OUTPUT" | grep "Channel URL" | grep -oP 'https://[^\s\[]+')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Comment PR with preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.preview.outputs.url }}';
            const channel = '${{ steps.preview.outputs.channel }}';
            const body = `### 🔥 Firebase Preview Deploy\n\n**Preview URL:** ${url}\n\nThis preview uses production Cloud Functions and Firestore — only the frontend is from this PR branch.\n\nChannel \`${channel}\` expires in 7 days.`;

            // Update existing comment or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('Firebase Preview Deploy'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Clean up credentials
        if: always()
        run: rm -f /tmp/sa-key.json

  e2e:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Install Firebase CLI and emulators
        run: |
          npm install -g firebase-tools
          firebase setup:emulators:firestore
          firebase setup:emulators:ui

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build functions
        run: npm run build -w functions

      - name: Build dealer
        run: npm run build -w dealer

      - name: Build frontend
        run: npm run build

      - name: Start services
        run: ./scripts/dev-up.sh --bg --no-functions

      - name: Dump service logs on failure
        if: failure()
        run: |
          echo "=== Emulator log ==="
          cat .logs/emulators.log 2>/dev/null || echo "(no emulator log)"
          echo "=== Vite log ==="
          cat .logs/vite.log 2>/dev/null || echo "(no vite log)"
          echo "=== Dealer log ==="
          cat .logs/dealer.log 2>/dev/null || echo "(no dealer log)"

      - name: Run E2E tests
        run: npx playwright test --reporter=list

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Stop services
        if: always()
        run: ./scripts/dev-down.sh
